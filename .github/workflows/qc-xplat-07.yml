name: qc-xplat-07
on:
  workflow_dispatch:

jobs:
  xplat7:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
      QRINGS_KEY_128: ${{ secrets.QRINGS_KEY_128 }}
      ORIGINQC_KEY_1: ${{ secrets.ORIGINQC_KEY_1 }}
    steps:
      - name: final wave — ORIGINQC sim+QPU / QR account audit / QUAFU QAOA
        run: |
          pip install -q -i https://pypi.org/simple pyquafu QuantumRingsLib pyqpanda3 2>&1 | tail -1
          python3 << 'PYEOF'
          import os, json, time
          def S_n2(counts,x1,x2,xb):
              good=tot=0
              for s,w in counts.items():
                  s=str(s).replace(' ','').replace('0b','')
                  if not s or not set(s)<={'0','1'}: continue
                  c=[int(ch) for ch in s[::-1]]
                  ok=(c[0]^c[1])==(x1 if not xb else x2)
                  good+=w if ok else 0; tot+=w
              return good/tot if tot else -1
          CASES8=[(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]

          print('======== ORIGINQC sim path (single QProg) ========')
          try:
              from pyqpanda3.qcloud import QCloudService
              from pyqpanda3.core import QCircuit, QProg, H, CNOT, X, Z, measure
              svc=QCloudService(os.environ['ORIGINQC_KEY_1'])
              beo=svc.backend('full_amplitude')
              def orig_prog(x1,x2,xb):
                  circ=QCircuit()
                  circ << H(0) << CNOT(0,1)
                  if x1: circ << X(0)
                  if x2: circ << Z(0)
                  if xb: circ << H(0) << H(1)
                  prog=QProg()
                  prog << circ << measure(0,0) << measure(1,1)
                  return prog
              for (x1,x2,xb) in CASES8:
                  try:
                      job=beo.run(orig_prog(x1,x2,xb), 512)
                      cnts=job.result().get_counts()
                      print('ORIGsim n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_n2(cnts,x1,x2,xb)))
                  except Exception as e: print('ORIGsim ERR',x1,x2,xb,type(e).__name__,str(e)[:130])
              print('--- ORIGINQC WK_C180 real QPU attempt ---')
              try:
                  beq=svc.backend('WK_C180')
                  job=beq.run([orig_prog(0,0,0)], 512)
                  jid=job.job_id(); print('WK_C180 job:',jid)
                  dl=time.time()+600
                  while time.time()<dl:
                      st=str(job.status())
                      print('WK_C180 status:',st[:60])
                      if 'FINISH' in st.upper() or 'COMPLETE' in st.upper() or 'SUCCESS' in st.upper():
                          print('WK_C180 counts:', str(job.result().get_counts())[:90]); break
                      if 'FAIL' in st.upper() or 'ERROR' in st.upper() or 'CANCEL' in st.upper(): break
                      time.sleep(20)
              except Exception as e: print('WK_C180 ERR',type(e).__name__,str(e)[:180])
          except Exception as e: print('ORIG FATAL',type(e).__name__,str(e)[:200])

          print('======== QR account audit ========')
          try:
              from QuantumRingsLib import QuantumRingsProvider
              p=QuantumRingsProvider(token=os.environ['QRINGS_KEY_128'])
              acc=p.active_account()
              print('active_account:', {k:v for k,v in acc.items() if 'token' not in k.lower()} if isinstance(acc,dict) else str(acc)[:200])
          except Exception as e: print('QR audit ERR',type(e).__name__,str(e)[:180])

          print('======== QUAFU QAOA 5-node ========')
          try:
              from quafu import QuantumCircuit, User, Task
              E5=[(0,1),(1,2),(2,3),(3,4),(4,0),(0,2)]
              def maxcut(bs): return sum(1 for (a,b) in E5 if ((bs>>a)&1)!=((bs>>b)&1))
              def qaoa_q(gammas,betas):
                  qc=QuantumCircuit(5)
                  for q in range(5): qc.h(q)
                  for g,b in zip(gammas,betas):
                      for (a,bb) in E5:
                          qc.cnot(a,bb); qc.rz(bb,g); qc.cnot(a,bb)
                      for q in range(5): qc.rx(q,2*b)
                  qc.measure([0,1,2,3,4]); return qc
              u=User(api_token=os.environ['QUAFU_API_TOKEN'])
              t=Task(u); t.config(backend='ScQ-Sim10', shots=2048, compile=True)
              for label,gs,bs_ in (('p1',(0.7,),(1.3,)),('p2',(0.6,1.0),(1.0,1.0))):
                  out=t.submit(qaoa_q(gs,bs_))
                  r0=out[0] if isinstance(out,tuple) else out
                  cnts=getattr(r0,'counts',{}) or {}
                  tot=sum(cnts.values()); pm=cf=0
                  for s,w in cnts.items():
                      bs10=int(str(s).replace(' ',''),2); mc=maxcut(bs10)
                      if mc==5: pm+=w
                      cf+=w*mc
                  print('QUAFU-QAOA %s P(max=5)=%.4f cutfrac=%.4f (local: p1 0.377/0.673, p2 0.546/-)'%(label,pm/tot,cf/tot/6.0))
          except Exception as e: print('QAOA ERR',type(e).__name__,str(e)[:200])
          PYEOF
