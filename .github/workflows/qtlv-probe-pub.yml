name: qtlv-probe-pub
# qtlv T55: 公域探针(billing闸时代)——vci-qtlv=公域仓,Actions免私域额度
# 值零打印; ABSENT容忍(密封盒注入后即活); 量子平台只读探,零电路零机时
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: deps
        run: pip install --quiet requests 2>&1 | tail -1; pip install --quiet pyqpanda 2>&1 | tail -1 || echo PYQPANDA_INSTALL_FAIL; pip install --quiet quafu 2>&1 | tail -3 || echo QUAFU_INSTALL_FAIL; python3 -c "import quafu; print('QUAFU_VER', getattr(quafu,'__version__','?'))" 2>&1 | tail -1 || echo QUAFU_IMPORT_STILL_FAIL
      - name: probe
        env:
          KIMI0: ${{ secrets.KIMI_API_KEY }}
          # 0920 名映射: vci-qtlv 实仓名(资源波 RESOURCE-WAVE-01 注入)
          KIMI1: ${{ secrets.KIMI_API_KEY }}
          KIMI2: ${{ secrets.KIMI_API_KEY }}
          KIMI3: ${{ secrets.KIMI_API_KEY }}
          DS1: ${{ secrets.DEEPSEEK_API_KEY }}
          DS2: ${{ secrets.DEEPSEEK_API_KEY }}
          DS3: ${{ secrets.DEEPSEEK_API_KEY }}
          OQ0: ${{ secrets.ORIGINQC_KEY_1 }}
          OQ_F: ${{ secrets.ORIGINQC_KEY_1 }}
          OQ_S: ${{ secrets.ORIGINQC_KEY_1 }}
          OQ_T: ${{ secrets.ORIGINQC_KEY_1 }}
          QUAFU: ${{ secrets.QUAFU_API_TOKEN }}
          QR64: ${{ secrets.QRINGS_KEY_64 }}
          QR128: ${{ secrets.QRINGS_KEY_128 }}
        run: |
          cat > probe.py <<'PYEOF'
          import os, json, time
          R = {"probe": "qtlv-probe-pub", "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "results": {}}
          def note(k, v): R["results"][k] = v; print(k, "=>", v)
          def http_probe(name, url, key):
              if not key: return note(name, "ABSENT")
              try:
                  import requests
                  r = requests.get(url, headers={"Authorization": "Bearer " + key}, timeout=12)
                  note(name, f"HTTP {r.status_code}")
              except Exception as e:
                  note(name, "ERR " + type(e).__name__)
          for nm, env in [("KIMI_NEW","KIMI0"),("KIMI_1","KIMI1"),("KIMI_2","KIMI2"),("KIMI_3","KIMI3")]:
              http_probe(nm, "https://api.moonshot.cn/v1/models", os.environ.get(env,""))
          for nm, env in [("DEEPSEEK_1","DS1"),("DEEPSEEK_2","DS2"),("DEEPSEEK_3","DS3")]:
              http_probe(nm, "https://api.deepseek.com/models", os.environ.get(env,""))
          try:
              from pyqpanda import QCloud
              for nm, env in [("ORIGINQC_main","OQ0"),("ORIGINQC_foxmail","OQ_F"),("ORIGINQC_spare","OQ_S"),("ORIGINQC_thai68","OQ_T")]:
                  k = os.environ.get(env,"")
                  if not k: note(nm, "ABSENT"); continue
                  try:
                      q = QCloud(); q.init_qvm(k, True)
                      note(nm, "init_qvm OK")
                      meths = [m for m in dir(q) if "machine" in m.lower() or "status" in m.lower() or "chip" in m.lower()]
                      note(nm+"_api_surface", ",".join(meths)[:200])
                      got = False
                      for m in ("get_machine_status","get_qmachine_status","machine_status","get_chip_status"):
                          if hasattr(q, m):
                              try: note(nm+"_machines", str(getattr(q, m)())[:200]); got = True; break
                              except Exception as e2: note(nm+"_machines", m+" ERR " + type(e2).__name__); got = True; break
                      if not got: note(nm+"_machines", "NO_KNOWN_METHOD")
                  except Exception as e:
                      note(nm, "init ERR " + type(e).__name__)
          except Exception as e:
              note("ORIGINQC_sdk", "IMPORT_FAIL " + type(e).__name__)
          # QRings: 免额度状态端点未证实, 名级判不呼(未实测不编数)
          for nm, env in [("QRINGS_64","QR64"),("QRINGS_128","QR128")]:
              note(nm, "PRESENT-name-level(no free endpoint probed)" if os.environ.get(env,"") else "ABSENT")
          try:
              from quafu import User
              k = os.environ.get("QUAFU","")
              if not k: note("QUAFU", "ABSENT")
              else:
                  u = User(); u.save_apitoken(k)
                  try: note("QUAFU", "auth OK backends=" + str(len(u.get_available_backends())))
                  except Exception as e2: note("QUAFU", "ERR " + type(e2).__name__)
          except Exception as e:
              note("QUAFU_sdk", "IMPORT_FAIL " + type(e).__name__)
          json.dump(R, open("receipt.json","w"), ensure_ascii=False, indent=1)
          print("RECEIPT_WRITTEN")
          PYEOF
          python3 probe.py
      - name: commit receipt
        run: |
          mkdir -p results
          cp receipt.json results/probe_pub_0915.json
          git config user.email "qtlv-probe@ci.local"; git config user.name "qtlv-probe"
          git add results/probe_pub_0915.json
          git commit -m "[skip ci] qtlv probe_pub receipt $(date -u +%Y%m%dT%H%M%SZ)" || echo NOCHANGE
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 3; done; exit 1
