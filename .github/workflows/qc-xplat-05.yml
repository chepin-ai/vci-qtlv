name: qc-xplat-05
on:
  workflow_dispatch:

jobs:
  xplat5:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
      QRINGS_KEY_128: ${{ secrets.QRINGS_KEY_128 }}
      ORIGINQC_KEY_1: ${{ secrets.ORIGINQC_KEY_1 }}
    steps:
      - name: three-platform adapter convergence + remainder fill
        run: |
          pip install -q -i https://pypi.org/simple pyquafu QuantumRingsLib pyqpanda3 2>&1 | tail -1
          python3 << 'PYEOF'
          import os, json, time
          def S_of(counts,tag,x1,x2,xb):
              good=tot=0
              for s,w in counts.items():
                  s=str(s).replace(' ','').replace('0b','')
                  if not s or not set(s)<={'0','1'}: continue
                  c=[int(ch) for ch in s[::-1]]
                  if tag=='n2': ok=(c[0]^c[1])==(x1 if not xb else x2)
                  else:
                      A=c[0]+2*c[1]; Bv=c[2]+2*c[3]
                      ok=(((A-Bv)%4)==x1) if not xb else (((A+Bv)%4)==x2)
                  good+=w if ok else 0; tot+=w
              return good/tot if tot else -1
          def qasm_n2(x1,x2,xb):
              L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[2] q;','bit[2] c;','h q[0];','cx q[0], q[1];']
              if x1: L.append('x q[0];')
              if x2: L.append('z q[0];')
              if xb: L+=['h q[0];','h q[1];']
              L+=['c[0] = measure q[0];','c[1] = measure q[1];']
              return '\n'.join(L)
          def qasm_d2(x1,x2,xb):
              L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[4] q;','bit[4] c;','h q[0];','cx q[0], q[2];']
              for _ in range(x1): L+=['cx q[0], q[1];','x q[0];']
              if x2%2==1: L.append('z q[1];')
              if x2==1: L.append('s q[0];')
              elif x2==2: L.append('z q[0];')
              elif x2==3: L.append('sdg q[0];')
              if xb:
                  L+=['swap q[0], q[1];','h q[0];','cp(-1.5707963267948966) q[0], q[1];','h q[1];',
                      'swap q[2], q[3];','h q[2];','cp(-1.5707963267948966) q[2], q[3];','h q[3];']
              L+=['c[%d] = measure q[%d];'%(i,i) for i in range(4)]
              return '\n'.join(L)
          CASES8=[(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]

          print('======== QUAFU ScQ-Sim10 (compile=True) ========')
          try:
              from quafu import QuantumCircuit, User, Task
              u=User(api_token=os.environ['QUAFU_API_TOKEN'])
              def build_q(x1,x2,xb):
                  qc=QuantumCircuit(2); qc.h(0); qc.cnot(0,1)
                  if x1: qc.x(0)
                  if x2: qc.z(0)
                  if xb: qc.h(0); qc.h(1)
                  qc.measure([0,1]); return qc
              t=Task(u); t.config(backend='ScQ-Sim10', shots=512, compile=True)
              for (x1,x2,xb) in CASES8:
                  try:
                      out=t.submit(build_q(x1,x2,xb))
                      r0=out[0][0] if isinstance(out,tuple) else out
                      cnts=getattr(r0,'counts',None) or {}
                      print('QSIM n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'n2',x1,x2,xb)))
                  except Exception as e: print('QSIM ERR',x1,x2,xb,type(e).__name__,str(e)[:130])
          except Exception as e: print('QSIM FATAL',type(e).__name__,str(e)[:150])

          print('======== QUANTUMRINGS core SDK ========')
          try:
              import QuantumRingsLib as QRL
              from QuantumRingsLib import QuantumRingsProvider, QuantumCircuit as QRC
              print('QRL version:', getattr(QRL,'__version__','?'))
              p=QuantumRingsProvider(token=os.environ['QRINGS_KEY_128'])
              be=p.get_backend('scarlet_quantum_rings')
              def qr_counts(qasm,shots,tag,x1,x2,xb):
                  qc=QRC.from_qasm_str(qasm)
                  job=be.run(qc, shots=shots, mode='sync')
                  return job.result().get_counts()
              first=True
              for (x1,x2,xb) in CASES8:
                  try:
                      cnts=qr_counts(qasm_n2(x1,x2,xb),512,'n2',x1,x2,xb)
                      print('QR n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'n2',x1,x2,xb)))
                  except Exception as e:
                      if first: print('QR first ERR detail:',type(e).__name__,str(e)[:250])
                      else: print('QR n2 ERR',x1,x2,xb,type(e).__name__,str(e)[:100])
                  first=False
              print('--- QR remainder fill ---')
              for (x1,x2,xb) in [(1,1,1),(2,2,0),(2,2,1),(3,3,0),(3,3,1)]:
                  try:
                      cnts=qr_counts(qasm_d2(x1,x2,xb),1024,'d2',x1,x2,xb)
                      print('QR d2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'d2',x1,x2,xb)))
                  except Exception as e: print('QR d2 ERR',x1,x2,xb,type(e).__name__,str(e)[:120])
              for sh in (256,4096):
                  try:
                      cnts=qr_counts(qasm_n2(1,1,1),sh,'n2',1,1,1)
                      print('QR n2(1,1,X) sh=%d S=%.4f'%(sh,S_of(cnts,'n2',1,1,1)))
                  except Exception as e: print('QR sweep ERR',sh,type(e).__name__,str(e)[:120])
          except Exception as e: print('QR FATAL',type(e).__name__,str(e)[:200])

          print('======== ORIGINQC full_amplitude ========')
          try:
              from pyqpanda3.qcloud import QCloudService
              from pyqpanda3.core import QCircuit, QProg, H, CNOT, X, Z, Measure
              svc=QCloudService(os.environ['ORIGINQC_KEY_1'])
              be=svc.backend('full_amplitude')
              def orig_counts(x1,x2,xb,shots):
                  circ=QCircuit()
                  circ << H(0) << CNOT(0,1)
                  if x1: circ << X(0)
                  if x2: circ << Z(0)
                  if xb: circ << H(0) << H(1)
                  prog=QProg()
                  prog << circ << Measure(0,0) << Measure(1,1)
                  r=be.run([prog], shots)
                  return r
              first=True
              for (x1,x2,xb) in CASES8:
                  try:
                      r=orig_counts(x1,x2,xb,512)
                      if first: print('run ret type:',type(r).__name__, str(r)[:200]); first=False
                      cnts=None
                      for cand in (r, r[0] if isinstance(r,(list,tuple)) and r else None):
                          if cand is None: continue
                          for attr in ('get_counts','counts','result','get_result'):
                              v=getattr(cand,attr,None)
                              v=v() if callable(v) else v
                              if isinstance(v,dict) and v: cnts=v; break
                          if cnts: break
                      print('ORIG n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts or {},'n2',x1,x2,xb)))
                  except Exception as e: print('ORIG ERR',x1,x2,xb,type(e).__name__,str(e)[:130])
          except Exception as e: print('ORIG FATAL',type(e).__name__,str(e)[:200])
          PYEOF
