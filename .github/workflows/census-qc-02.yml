name: CENSUS-QC-02 (拍47·chepin-ai显式仓单量子钥名级普查)
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: census
        run: |
          python3 - <<'PYEOF'
          import os, json, re, urllib.request
          QPAT=re.compile(r'RING|QUAFU|ORIGIN|QR_|QR64|QR128|QUANTUM|IBM_?Q|QISKIT|AQT|IONQ|RIGETTI|XANADU',re.I)
          def get(tok,url):
              H={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'}
              try:
                  rq=urllib.request.Request(url,headers=H)
                  with urllib.request.urlopen(rq,timeout=20) as r: return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e: return e.code, {}
          ai=os.environ.get('AI_FULL_PAT','')
          repos=['vci-vinf','vci-lgt','vci-usrm','vci-qfa','vci-qtlv','vci-ucif2','vci-qgl','vci-cfts','vci-qlv','vci-lvlu','vci-inbox','ci-inbox','usrm-repo','qtlv-quantum-encoder','qlv','qlv-lab','lgt-line','lgt-worker-01','quantum-go-ledger','ci-control','ci-control-backup','ai-quant-research','ucif2-formalization-kernel','vinf-market-kernel','PRIMA','ETCS-Formalization','isu-unified-framework','D4UniversalOptimality','YHCSCT','GCML','DTE-Project','v40-sorry-resolver','sorry-resolver','ci-warm']
          out={}
          for rn in repos:
              st,dd=get(ai,'https://api.github.com/repos/chepin-ai/%s/actions/secrets?per_page=100'%rn)
              if st==200:
                  names=[s['name'] for s in dd.get('secrets',[])]
                  hits=[n for n in names if QPAT.search(n)]
                  out[rn]={'n':len(names),'hits':hits} if hits else {'n':len(names)}
              else: out[rn]='HTTP %s'%st
          print('CENSUS-QC-02 '+json.dumps(out,ensure_ascii=False))
          PYEOF
