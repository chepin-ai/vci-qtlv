name: qtlv-qe-eraser
# T66 量子擦除全息电路类比·Tier-2云仿 (ScQ-Sim10优先, ScQ-Sim备)
# 纪律: 单次提交零重试; 仅云仿不触hw(P5死队列在案); 判据端序无关
# 预注册(NOTE-27 §判据): A件(α=0,Z基): 四结果各≈25%(±8%); B件(α=45°,X基): P(比特相异)=1(P(00)+P(11)≤2%)
on:
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: qtlv-qe-eraser, cancel-in-progress: false }
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: pip install --quiet pyquafu 2>&1 | tail -1
      - name: run-and-collect
        env:
          QUAFU: ${{ secrets.QUAFU_API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, time
          from quafu import QuantumCircuit, Task, User
          os.makedirs("results", exist_ok=True)
          R = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "beat": "T66"}
          u = User(os.environ["QUAFU"]); t = Task(u)
          names = list(t._available_backends.keys())
          chip = "ScQ-Sim10" if "ScQ-Sim10" in names else ("ScQ-Sim" if "ScQ-Sim" in names else None)
          R["chip"] = chip
          if chip is None:
              R["err"] = "no sim backend"; json.dump(R, open("results/qe_eraser_result.json","w")); raise SystemExit(1)
          t.config(backend=chip, shots=1024, compile=True)
          def build(eraser):
              qc = QuantumCircuit(2)
              qc.h(0); qc.z(0); qc.cnot(0,1); qc.h(1)   # Phi- (Z修号,T66首跑失校Phi+已录) + screen H
              if eraser: qc.h(0)                # eraser: q0 测X基 (alpha=45°)
              qc.measure([0,1])
              return qc
          ids = {}
          for nm, er in [("A_whichway", False), ("B_eraser", True)]:
              r = t.send(build(er), name="qtlv_t66qe_"+nm, group="qtlv_t66qe", wait=False)
              ids[nm] = r.taskid
          R["task_ids"] = ids
          # 单run内等待≤240s; 未完成则落task件下拍收
          out = {}
          deadline = time.time() + 240
          while time.time() < deadline and len(out) < 2:
              for nm, tid in ids.items():
                  if nm in out: continue
                  try:
                      r = t.retrieve(tid)
                      if r.task_status == "Completed":
                          out[nm] = {"status": "Completed", "counts": dict(r.counts)}
                  except Exception as e:
                      pass
              if len(out) < 2: time.sleep(8)
          for nm, tid in ids.items():
              out.setdefault(nm, {"status": "Pending", "taskid": tid})
          R["collect"] = out
          print("RESULT", json.dumps(out)[:600])
          json.dump(R, open("results/qe_eraser_result.json","w"), indent=1)
          PYEOF
      - name: commit
        if: always()
        run: |
          git config user.name "qtlv-bot"; git config user.email "qtlv-bot@local"
          git add results/qe_eraser_result.json
          git commit -m "[skip ci] T66 qe-eraser cloud-sim result" || echo "nothing to commit"
          git pull --rebase && git push || (git pull --rebase && git push)
