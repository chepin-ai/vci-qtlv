name: KEY-RELAY-QC-02-SEED (拍47·向持钥仓注relay+点火)
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
  RELAY_B64: 
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: seed-and-fire
        run: |
          python3 - <<'PYEOF'
          import os, json, base64, urllib.request, time
          PAT=os.environ.get('AI_FULL_PAT','')
          H={'Authorization':'Bearer '+PAT,'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def req(method,url,data=None):
              rq=urllib.request.Request(url,data=data,headers=H,method=method)
              try:
                  with urllib.request.urlopen(rq,timeout=30) as r: return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e: return e.code, {}
          b64c=os.environ['RELAY_B64']
          out={}
          for repo in ['usrm-repo','vinf-market-kernel','qlv']:
              st,_=req('PUT','https://api.github.com/repos/chepin-ai/%s/contents/.github/workflows/key-relay-qc-02.yml'%repo,
                  json.dumps({'message':'KEY-RELAY-QC-02 (beat47)','content':b64c}).encode())
              out[repo]={'put':st}
              time.sleep(6)
              if st in (200,201):
                  st2,d=req('GET','https://api.github.com/repos/chepin-ai/%s/actions/workflows?per_page=100'%repo)
                  wfs=[w for w in d.get('workflows',[]) if 'KEY-RELAY-QC-02' in w['name']]
                  if wfs:
                      st3,_=req('POST','https://api.github.com/repos/chepin-ai/%s/actions/workflows/%s/dispatches'%(repo,wfs[0]['id']),
                          json.dumps({'ref':'main'}).encode())
                      out[repo]['fire']=st3; out[repo]['wid']=wfs[0]['id']
          print('SEED-RCPT '+json.dumps(out,ensure_ascii=False))
          PYEOF
