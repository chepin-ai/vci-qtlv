name: origin-firstshot-05
# ORIGINQC-FIRSTSHOT-05 枢/PIVOT-01代铸·待命轮(qtlv正宿主·KEY_5槽)
# 待命态: KEYREQ-PIVOT-R19-01已投lvlu钥务毂(申请KEY_5/6值入vci-qtlv secrets作ORIGINQC_KEY_5)
# 槽空即graceful-abort(不触API·不算射击) · 槽有钥则单发零重试 · 禁submitTask/轮询/PQC/batch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firstshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGINQC_KEY_5: ${{ secrets.ORIGINQC_KEY_5 }}
    steps:
      - uses: actions/checkout@v4
      - name: KEY_5 single-shot estimate (abort-if-empty)
        id: stageB
        run: |
          python3 << 'PYEOF'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('ORIGINQC_KEY_5','') or ''
          if not key:
              print('KEY_5槽空 — graceful abort(未触API·未消耗射击)')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('verdict=SLOT_EMPTY\nhttp=\ncode=\nmsg=\n')
              raise SystemExit(0)
          u='https://console.originqc.com.cn/api/oqcs/task/estimate.json'
          body=json.dumps({"qubitNum":6,"shot":1,"qprogCount":1,"epoch":1}).encode()
          req=urllib.request.Request(u,data=body,method='POST',headers={
              'Content-Type':'application/json','User-Agent':'Mozilla/5.0',
              'Authorization':f'oqcs_auth={key}'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r: sc,bd=r.status,r.read().decode('utf-8','ignore')
          except urllib.error.HTTPError as e: sc,bd=e.code,e.read().decode('utf-8','ignore')[:600]
          except Exception as e: sc,bd='ERR',str(e)
          msg='';code=None;succ=None
          try:
              j=json.loads(bd);msg=str(j.get('message',''));code=j.get('code');succ=j.get('success')
          except Exception: msg=(bd or '')[:200]
          low=(msg or '').lower()
          if sc=='ERR': v='NETWORK_FAIL'
          elif sc==405: v='ENDPOINT_MOVED'
          elif 'un-activate' in low or 'computing power' in low or '未激活' in msg or '算力' in msg: v='AUTH_OK_NO_QUOTA'
          elif 'api key' in low or 'apikey' in low or 'invalid' in low or '无效' in msg: v='AUTH_INVALID'
          elif succ is True or (sc==200 and code==10000): v='AUTH_OK'
          elif sc in(401,403) or code==401: v='AUTH_REJECTED'
          elif sc==200: v=f'UNMAPPED_200_code{code}'
          else: v=f'HTTP_{sc}'
          print(f'STAGE_B_VERDICT={v} (http={sc} code={code})')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'verdict={v}\nhttp={sc}\ncode={code}\nmsg={msg[:120].replace(chr(10)," ")}\n')
          PYEOF
      - name: Receipt (zero key values)
        env:
          VB: ${{ steps.stageB.outputs.verdict }}
          HB: ${{ steps.stageB.outputs.http }}
          CB: ${{ steps.stageB.outputs.code }}
          MB: ${{ steps.stageB.outputs.msg }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p receipts/origin-firstshot
          cat > receipts/origin-firstshot/${TS}.md << EOF
          # ORIGINQC-FIRSTSHOT-05 本源五射回执(KEY_5·qtlv正宿主)
          - ts: ${TS} · run: ${GITHUB_RUN_ID}
          ## Stage B (/api/oqcs/task/estimate.json, KEY_5, qubitNum=6 shot=1)
          - verdict: ${VB} (http=${HB} code=${CB}) · msg: ${MB}
          ## 律守: 单发零重试·零密钥值·禁submitTask/轮询/PQC/batch
          EOF
          git config user.name 'vci-qtlv-bot'; git config user.email 'bot@vci-qtlv.local'
          git add receipts/origin-firstshot/${TS}.md
          git commit -m "receipt: ORIGINQC-FIRSTSHOT-05 ${TS} KEY5=${VB}" -q
          git push -q origin HEAD:main && echo "receipt pushed" || echo "push failed(non-fatal)"
