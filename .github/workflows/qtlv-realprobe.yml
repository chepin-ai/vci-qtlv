name: qtlv-realprobe
# T61 真机实测 (QUAFU道): Z4 x3=CNOT 乘子门 1-bit QPE — 仿真预验已过 (results/qpe_z4_sim)
# 纪律: 单次提交零重试; 提交/回收分相 (事件驱动: 本拍提交, 下拍dispatch回收)
on:
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: qtlv-realprobe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: pip install --quiet pyquafu 2>&1 | tail -1
      - name: submit-or-collect
        env:
          QUAFU: ${{ secrets.QUAFU_API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, time
          from quafu import QuantumCircuit, Task, User
          os.makedirs("results", exist_ok=True)
          R = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          u = User(os.environ["QUAFU"])
          t = Task(u)
          names = list(t._available_backends.keys())
          R["backends"] = names
          if os.path.exists("results/realprobe_task.json"):
              meta = json.load(open("results/realprobe_task.json"))
              out = {}
              for nm, tid in zip(meta["circuits"], meta["task_ids"]):
                  try:
                      r = t.retrieve(tid)
                      out[nm] = {"status": r.task_status, "counts": dict(r.counts)}
                  except Exception as e:
                      out[nm] = {"err": type(e).__name__ + " " + str(e)[:150]}
              R["collect_sim"] = out
              print("COLLECT_SIM", json.dumps(out)[:400])
              # 真机相: 无 hw 件则提交 (单次零重试); 有则回收
              if not os.path.exists("results/realprobe_task_hw.json"):
                  EST, HI, LO = 2, 1, 0
                  def build(init):
                      qc = QuantumCircuit(3)
                      if init == 1: qc.x(LO)
                      elif init == 2: qc.x(HI)
                      qc.h(EST); qc.toffoli(EST, LO, HI); qc.h(EST)
                      qc.measure([EST])
                      return qc
                  # P10 denied (no permission) -> 逐芯尝试直至一芯受理或全拒
                  order = ["Baiwang","ScQ-P18","Miaofeng","Dongling","Haituo","Baihua",
                           "Yunmeng","Xiang","ScQ-P102","ScQ-P21","ScQ-P3","ScQ-P5"]
                  hw = [n for n in order if n in names]
                  denied, chip, ids = [], None, []
                  for c in hw:
                      try:
                          t.config(backend=c, shots=1024, compile=True)
                          r0 = t.send(build(0), name="qtlv_t61hw_c0", group="qtlv_t61hw", wait=False)
                          ids = [r0.taskid]; chip = c
                          break
                      except Exception as e:
                          denied.append(c + ":" + type(e).__name__)
                  if chip:
                      for i in (1, 2):
                          r = t.send(build(i), name=f"qtlv_t61hw_c{i}", group="qtlv_t61hw", wait=False)
                          ids.append(r.taskid)
                      meta2 = {"task_ids": ids, "chip": chip, "shots": 1024,
                               "circuits": ["ctrl_ket00","test_ket01","test_ket10"], "denied": denied}
                      json.dump(meta2, open("results/realprobe_task_hw.json","w"), ensure_ascii=False, indent=1)
                      R["submitted_hw"] = meta2
                      print("SUBMIT_HW", chip, ids)
                  else:
                      R["hw_denied_all"] = denied
                      json.dump({"denied": denied}, open("results/realprobe_task_hw_denied.json","w"), ensure_ascii=False, indent=1)
                      print("HW_DENIED_ALL", denied)
              else:
                  meta2 = json.load(open("results/realprobe_task_hw.json"))
                  out2 = {}
                  for nm, tid in zip(meta2["circuits"], meta2["task_ids"]):
                      try:
                          r = t.retrieve(tid)
                          out2[nm] = {"status": r.task_status, "counts": dict(r.counts)}
                      except Exception as e:
                          out2[nm] = {"err": type(e).__name__ + " " + str(e)[:150]}
                  R["collect_hw"] = out2
                  print("COLLECT_HW", json.dumps(out2)[:400])
              json.dump(R, open("results/realprobe_result.json","w"), ensure_ascii=False, indent=1)
          else:
              EST, HI, LO = 2, 1, 0
              def build(init):
                  qc = QuantumCircuit(3)
                  if init == 1: qc.x(LO)
                  elif init == 2: qc.x(HI)
                  qc.h(EST); qc.toffoli(EST, LO, HI); qc.h(EST)
                  qc.measure([EST])
                  return qc
              chip = None
              for n in names:
                  b = t._available_backends[n]
                  if getattr(b, "qubit_num", 0) >= 3 and getattr(b, "status", "").lower() in ("online","available",""):
                      chip = n; break
              if chip is None: chip = names[0]
              t.config(backend=chip, shots=1024, compile=True)
              ids = []
              for i, qc in enumerate([build(0), build(1), build(2)]):
                  r = t.send(qc, name=f"qtlv_t61_c{i}", group="qtlv_t61", wait=False)
                  ids.append(r.taskid)
              meta = {"task_ids": ids, "chip": chip, "shots": 1024,
                      "circuits": ["ctrl_ket00","test_ket01","test_ket10"],
                      "pred": {"ctrl_ket00": {"0":1.0}, "test_ket01": {"0":0.5,"1":0.5}, "test_ket10": {"0":1.0}}}
              json.dump(meta, open("results/realprobe_task.json","w"), ensure_ascii=False, indent=1)
              R["submitted"] = meta
              json.dump(R, open("results/realprobe_submit.json","w"), ensure_ascii=False, indent=1)
              print("SUBMIT_PHASE", chip, ids)
          PYEOF
      - name: commit receipt
        if: always()
        run: |
          git config user.email "qtlv-probe@ci.local"; git config user.name "qtlv-probe"
          git add results/ || true
          git commit -m "[skip ci] qtlv realprobe $(date -u +%Y%m%dT%H%M%SZ)" || echo NOCHANGE
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 3; done; exit 1
