name: qc-rac-xplat-03
on:
  workflow_dispatch:

jobs:
  xplat3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
      QRINGS_KEY_128: ${{ secrets.QRINGS_KEY_128 }}
    steps:
      - name: cross-platform wave-3 — adapters fixed + remainder fill
        run: |
          pip install -q -i https://pypi.org/simple pyquafu QuantumRingsLib qiskit qiskit-qasm3-import 2>&1 | tail -1
          python3 << 'PYEOF'
          import os, json, inspect, time
          def S_of(counts,tag,x1,x2,xb):
              good=tot=0
              for s,w in counts.items():
                  s=str(s).replace(' ','').replace('0b','')
                  if not s or not set(s)<={'0','1'}: continue
                  c=[int(ch) for ch in s[::-1]]
                  if tag=='n2':
                      ok=(c[0]^c[1])==(x1 if not xb else x2)
                  else:
                      A=c[0]+2*c[1]; Bv=c[2]+2*c[3]
                      ok=(((A-Bv)%4)==x1) if not xb else (((A+Bv)%4)==x2)
                  good+=w if ok else 0; tot+=w
              return good/tot if tot else -1
          def qasm_n2(x1,x2,xb):
              L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[2] q;','bit[2] c;','h q[0];','cx q[0], q[1];']
              if x1: L.append('x q[0];')
              if x2: L.append('z q[0];')
              if xb: L+=['h q[0];','h q[1];']
              L+=['c[0] = measure q[0];','c[1] = measure q[1];']
              return '\n'.join(L)
          def qasm_d2(x1,x2,xb):
              L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[4] q;','bit[4] c;',
                 'h q[0];','cx q[0], q[2];']
              for _ in range(x1): L+=['cx q[0], q[1];','x q[0];']
              if x2%2==1: L.append('z q[1];')
              if x2==1: L.append('s q[0];')
              elif x2==2: L.append('z q[0];')
              elif x2==3: L.append('sdg q[0];')
              if xb:
                  L+=['swap q[0], q[1];','h q[0];','cp(-1.5707963267948966) q[0], q[1];','h q[1];',
                      'swap q[2], q[3];','h q[2];','cp(-1.5707963267948966) q[2], q[3];','h q[3];']
              L+=['c[%d] = measure q[%d];'%(i,i) for i in range(4)]
              return '\n'.join(L)

          print('======== QUAFU ========')
          from quafu import QuantumCircuit, User, Task
          u=User(api_token=os.environ['QUAFU_API_TOKEN'])
          def build_q(x1,x2,xb):
              qc=QuantumCircuit(2)
              qc.h(0); qc.cnot(0,1)
              if x1: qc.x(0)
              if x2: qc.z(0)
              if xb: qc.h(0); qc.h(1)
              qc.measure([0,1])
              return qc
          def counts_of(out):
              r0 = out[0][0] if isinstance(out,tuple) else out
              for attr in ('counts','res','results','measure'):
                      v=getattr(r0,attr,None)
                      if isinstance(v,dict) and v: return v
              try:
                  d=r0.__dict__; 
                  for k,v in d.items():
                      if isinstance(v,dict) and v and all(set(str(x).replace(' ',''))<= {'0','1'} for x in v): return v
              except Exception: pass
              return {}
          t=Task(u)
          qsim_ok=False
          try:
              t.config(backend='ScQ-Sim10', shots=512, compile=False)
              first=True
              for (x1,x2,xb) in [(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]:
                  out=t.submit(build_q(x1,x2,xb))
                  if first:
                      r0=out[0][0] if isinstance(out,tuple) else out
                      print('ExecResult attrs:',[m for m in dir(r0) if not m.startswith('_')][:20]); first=False
                  cnts=counts_of(out)
                  S=S_of(cnts,'n2',x1,x2,xb)
                  if S>=0: qsim_ok=True
                  print('QSIM n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S))
          except Exception as e:
              print('QSIM ERR',type(e).__name__,str(e)[:150])
          try:
              print('--- Baihua real QPU (compile=True) ---')
              t2=Task(u); t2.config(backend='Baihua', shots=512, compile=True)
              out=t2.submit(build_q(0,0,0))
              r0=out[0][0] if isinstance(out,tuple) else out
              cnts=counts_of(out)
              print('Baihua n2 (0,0,Z) S=%.4f raw=%s'%(S_of(cnts,'n2',0,0,0),str(cnts)[:80]))
          except Exception as e:
              print('Baihua ERR',type(e).__name__,str(e)[:180])

          print('======== QUANTUMRINGS ========')
          qr_ok=False
          try:
              from QuantumRingsLib import QuantumRingsProvider
              import qiskit
              from qiskit import qasm3 as q3
              p=QuantumRingsProvider(token=os.environ['QRINGS_KEY_128'])
              be=p.get_backend('scarlet_quantum_rings')
              def qr_run(qc,shots):
                  for variant in ('exec','list','plain'):
                      try:
                          if variant=='exec':
                              job=qiskit.execute(qc, backend=be, shots=shots)
                          elif variant=='list':
                              job=be.run([qc], shots=shots)
                          else:
                              job=be.run(qc)
                          return job.result().get_counts(), variant
                      except Exception as e:
                          last=str(e)[:100]
                  return None, last
              for (x1,x2,xb) in [(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]:
                  qc=q3.loads(qasm_n2(x1,x2,xb))
                  cnts,how=qr_run(qc,512)
                  if cnts:
                      qr_ok=True
                      print('QR n2 x1=%d x2=%d %s S=%.4f (%s)'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'n2',x1,x2,xb),how))
                  else:
                      print('QR n2 ERR',x1,x2,xb,how)
              if qr_ok:
                  print('--- QR fills quota remainder: d2x5 + sweep ---')
                  for (x1,x2,xb) in [(1,1,1),(2,2,0),(2,2,1),(3,3,0),(3,3,1)]:
                      qc=q3.loads(qasm_d2(x1,x2,xb))
                      cnts,how=qr_run(qc,1024)
                      print('QR d2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'d2',x1,x2,xb)) if cnts else ('QR d2 ERR %d %d %d %s'%(x1,x2,xb,how)))
                  for sh in (256,4096):
                      qc=q3.loads(qasm_n2(1,1,1))
                      cnts,how=qr_run(qc,sh)
                      print('QR n2 (1,1,X) shots=%d S=%.4f'%(sh,S_of(cnts,'n2',1,1,1)) if cnts else ('QR sweep ERR %s'%how))
          except Exception as e:
              print('QR FATAL',type(e).__name__,str(e)[:180])
          PYEOF
