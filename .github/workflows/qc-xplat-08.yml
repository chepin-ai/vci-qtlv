name: qc-xplat-08
on:
  workflow_dispatch:

jobs:
  xplat8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
      ORIGINQC_KEY_1: ${{ secrets.ORIGINQC_KEY_1 }}
    steps:
      - name: final wave — ORIGINQC poll + QAOA corrected eval
        run: |
          pip install -q -i https://pypi.org/simple pyquafu pyqpanda3 2>&1 | tail -1
          python3 << 'PYEOF'
          import os, time
          print('======== ORIGINQC full_amplitude (status-poll) ========')
          try:
              from pyqpanda3.qcloud import QCloudService
              from pyqpanda3.core import QCircuit, QProg, H, CNOT, X, Z, measure
              svc=QCloudService(os.environ['ORIGINQC_KEY_1'])
              beo=svc.backend('full_amplitude')
              circ=QCircuit(); circ << H(0) << CNOT(0,1)
              prog=QProg(); prog << circ << measure(0,0) << measure(1,1)
              job=beo.run(prog, 512)
              print('job id:', job.job_id())
              dl=time.time()+300
              while time.time()<dl:
                  st=str(job.status())
                  print('status:', st[:50])
                  if 'FINISH' in st.upper() or 'SUCCESS' in st.upper() or 'DONE' in st.upper(): break
                  if 'FAIL' in st.upper() or 'ERROR' in st.upper(): break
                  time.sleep(10)
              res=job.result()
              print('result raw:', str(res)[:150])
              print('counts:', str(res.get_counts())[:120])
          except Exception as e: print('ORIG ERR',type(e).__name__,str(e)[:200])

          print('======== QUAFU QAOA corrected bit-order ========')
          from quafu import QuantumCircuit, User, Task
          E5=[(0,1),(1,2),(2,3),(3,4),(4,0),(0,2)]
          def maxcut(bs): return sum(1 for (a,b) in E5 if ((bs>>a)&1)!=((bs>>b)&1))
          def qaoa_q(gammas,betas):
              qc=QuantumCircuit(5)
              for q in range(5): qc.h(q)
              for g,b in zip(gammas,betas):
                  for (a,bb) in E5:
                      qc.cnot(a,bb); qc.rz(bb,g); qc.cnot(a,bb)
                  for q in range(5): qc.rx(q,2*b)
              qc.measure([0,1,2,3,4]); return qc
          u=User(api_token=os.environ['QUAFU_API_TOKEN'])
          t=Task(u); t.config(backend='ScQ-Sim10', shots=2048, compile=True)
          for label,gs,bs_ in (('p1',(0.7,),(1.3,)),('p2',(0.6,1.0),(1.0,1.0))):
              out=t.submit(qaoa_q(gs,bs_))
              r0=out[0] if isinstance(out,tuple) else out
              cnts=getattr(r0,'counts',{}) or {}
              tot=sum(cnts.values())
              for order in ('rev','fwd'):
                  pm=cf=0
                  for s,w in cnts.items():
                      ss=str(s).replace(' ','')
                      if order=='rev': ss=ss[::-1]
                      mc=maxcut(int(ss,2))
                      if mc==5: pm+=w
                      cf+=w*mc
                  print('QAOA %s [%s] P(max=5)=%.4f cutfrac=%.4f (local p1:0.377/0.673 p2:0.546/-)'%(label,order,pm/tot,cf/tot/6.0))
          PYEOF
