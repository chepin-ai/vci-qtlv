name: qc-rac-xplat-04
on:
  workflow_dispatch:

jobs:
  xplat4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
      QRINGS_KEY_128: ${{ secrets.QRINGS_KEY_128 }}
    steps:
      - name: cross-platform wave-4 — QSIM compile=True + QR qiskit version pin
        run: |
          python3 -c "import importlib.metadata as m; print('QRlib requires:', m.requires('QuantumRingsLib'))" 2>/dev/null || pip download -q -i https://pypi.org/simple QuantumRingsLib --no-deps -d /tmp/qrmeta 2>&1 | tail -1
          pip install -q -i https://pypi.org/simple pyquafu 2>&1 | tail -1
          python3 -c "import importlib.metadata as m; print('QRlib requires:', m.requires('QuantumRingsLib'))"
          pip install -q -i https://pypi.org/simple QuantumRingsLib "qiskit==1.2.4" qiskit-qasm3-import 2>&1 | tail -1
          python3 << 'PYEOF'
          import os, json, time
          def S_of(counts,tag,x1,x2,xb):
              good=tot=0
              for s,w in counts.items():
                  s=str(s).replace(' ','').replace('0b','')
                  if not s or not set(s)<={'0','1'}: continue
                  c=[int(ch) for ch in s[::-1]]
                  if tag=='n2': ok=(c[0]^c[1])==(x1 if not xb else x2)
                  else:
                      A=c[0]+2*c[1]; Bv=c[2]+2*c[3]
                      ok=(((A-Bv)%4)==x1) if not xb else (((A+Bv)%4)==x2)
                  good+=w if ok else 0; tot+=w
              return good/tot if tot else -1
          print('======== QUAFU (compile=True) ========')
          from quafu import QuantumCircuit, User, Task
          u=User(api_token=os.environ['QUAFU_API_TOKEN'])
          def build_q(x1,x2,xb):
              qc=QuantumCircuit(2)
              qc.h(0); qc.cnot(0,1)
              if x1: qc.x(0)
              if x2: qc.z(0)
              if xb: qc.h(0); qc.h(1)
              qc.measure([0,1])
              return qc
          def counts_of(out):
              r0 = out[0][0] if isinstance(out,tuple) else out
              for attr in ('counts','res','results','measure'):
                      v=getattr(r0,attr,None)
                      if isinstance(v,dict) and v: return v
              return getattr(r0,'counts',{}) or {}
          try:
              t=Task(u); t.config(backend='ScQ-Sim10', shots=512, compile=True)
              for (x1,x2,xb) in [(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]:
                  try:
                      out=t.submit(build_q(x1,x2,xb))
                      cnts=counts_of(out)
                      print('QSIM n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'n2',x1,x2,xb)))
                  except Exception as e:
                      print('QSIM ERR',x1,x2,xb,type(e).__name__,str(e)[:120])
          except Exception as e:
              print('QSIM FATAL',type(e).__name__,str(e)[:150])
          print('======== QUANTUMRINGS (pinned qiskit) ========')
          try:
              import qiskit; print('qiskit', qiskit.__version__)
              from QuantumRingsLib import QuantumRingsProvider
              from qiskit import qasm3 as q3
              p=QuantumRingsProvider(token=os.environ['QRINGS_KEY_128'])
              be=p.get_backend('scarlet_quantum_rings')
              def qasm_n2(x1,x2,xb):
                  L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[2] q;','bit[2] c;','h q[0];','cx q[0], q[1];']
                  if x1: L.append('x q[0];')
                  if x2: L.append('z q[0];')
                  if xb: L+=['h q[0];','h q[1];']
                  L+=['c[0] = measure q[0];','c[1] = measure q[1];']
                  return '\n'.join(L)
              ok1=False
              for (x1,x2,xb) in [(x1,x2,xb) for x1 in (0,1) for x2 in (0,1) for xb in (0,1)]:
                  try:
                      qc=q3.loads(qasm_n2(x1,x2,xb))
                      job=be.run(qc, shots=512)
                      cnts=job.result().get_counts()
                      ok1=True
                      print('QR n2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(cnts,'n2',x1,x2,xb)))
                  except Exception as e:
                      print('QR n2 ERR',x1,x2,xb,type(e).__name__,str(e)[:180])
              if ok1:
                  print('--- QR fills: d2x5 + sweep ---')
                  def qasm_d2(x1,x2,xb):
                      L=['OPENQASM 3.0;','include "stdgates.inc";','qubit[4] q;','bit[4] c;','h q[0];','cx q[0], q[2];']
                      for _ in range(x1): L+=['cx q[0], q[1];','x q[0];']
                      if x2%2==1: L.append('z q[1];')
                      if x2==1: L.append('s q[0];')
                      elif x2==2: L.append('z q[0];')
                      elif x2==3: L.append('sdg q[0];')
                      if xb:
                          L+=['swap q[0], q[1];','h q[0];','cp(-1.5707963267948966) q[0], q[1];','h q[1];',
                              'swap q[2], q[3];','h q[2];','cp(-1.5707963267948966) q[2], q[3];','h q[3];']
                      L+=['c[%d] = measure q[%d];'%(i,i) for i in range(4)]
                      return '\n'.join(L)
                  for (x1,x2,xb) in [(1,1,1),(2,2,0),(2,2,1),(3,3,0),(3,3,1)]:
                      try:
                          job=be.run(q3.loads(qasm_d2(x1,x2,xb)), shots=1024)
                          print('QR d2 x1=%d x2=%d %s S=%.4f'%(x1,x2,'X' if xb else 'Z',S_of(job.result().get_counts(),'d2',x1,x2,xb)))
                      except Exception as e: print('QR d2 ERR',x1,x2,xb,type(e).__name__,str(e)[:120])
                  for sh in (256,4096):
                      try:
                          job=be.run(q3.loads(qasm_n2(1,1,1)), shots=sh)
                          print('QR n2(1,1,X) sh=%d S=%.4f'%(sh,S_of(job.result().get_counts(),'n2',1,1,1)))
                      except Exception as e: print('QR sweep ERR',sh,type(e).__name__,str(e)[:120])
          except Exception as e:
              print('QR FATAL',type(e).__name__,str(e)[:200])
          PYEOF
