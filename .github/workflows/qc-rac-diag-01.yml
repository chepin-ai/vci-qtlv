name: qc-rac-diag-01
on:
  workflow_dispatch:

jobs:
  gate-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QBRAID_API_KEY: ${{ secrets.QBRAID_API_KEY }}
    steps:
      - name: gate support diagnostic on QIR-SV
        run: |
          python3 << 'PYEOF'
          import os, json, time, requests
          KEY=os.environ['QBRAID_API_KEY']
          B='https://api-v2.qbraid.com/api/v1'
          H={'X-API-Key':KEY,'X-Domain':'qbraid','Content-Type':'application/json'}
          DEV='qbraid:qbraid:sim:qir-sv'
          PRE=['OPENQASM 3.0;','include "stdgates.inc";','qubit[2] q;','bit[2] c;','h q[0];','h q[1];']
          POST=['c[0] = measure q[0];','c[1] = measure q[1];']
          variants={
            'swap':['swap q[0], q[1];'],
            'csdg':['csdg q[0], q[1];'],
            'cp':['cp(-1.5707963267948966) q[0], q[1];'],
            't_tdg':['t q[0];','tdg q[1];'],
            'rz':['rz(1.5707963267948966) q[0];'],
            'crz':['crz(1.5707963267948966) q[0], q[1];'],
          }
          def submit(nm,body):
              q='\n'.join(PRE+body+POST)
              r=requests.post(B+'/jobs',headers=H,json={'name':nm,'deviceQrn':DEV,'shots':128,
                  'program':{'format':'qasm3','data':q}},timeout=40)
              if r.status_code not in (200,201,202): return ('SUBMIT_ERR',r.text[:120])
              d=r.json().get('data',{}); qrn=d.get('jobQrn')
              dl=time.time()+420
              while time.time()<dl:
                  rr=requests.get(B+'/jobs/'+qrn,headers=H,timeout=30)
                  st=(rr.json().get('data') or {}).get('status','?')
                  if st in ('COMPLETED','FAILED','CANCELLED','ERROR'): 
                      det=rr.json().get('data',{})
                      msg=det.get('message') or det.get('error') or ''
                      return (st,str(msg)[:200])
                  time.sleep(5)
              return ('TIMEOUT','')
          for nm,body in variants.items():
              st,info=submit('diag-'+nm,body)
              print('%-7s -> %s %s'%(nm,st,info)); time.sleep(1)
          PYEOF
